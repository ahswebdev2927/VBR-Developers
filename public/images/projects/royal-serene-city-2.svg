<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rsSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1A30" />
      <stop offset="100%" stop-color="#2D4675" />
    </linearGradient>
    <linearGradient id="dtcpGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A45C" />
      <stop offset="100%" stop-color="#E5C77A" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#rsSky)" />
  <rect y="320" width="800" height="180" fill="#2E693B" />
  <!-- Grand Gate Arch -->
  <path d="M260,360 L260,200 L540,200 L540,360" stroke="#E3642B" stroke-width="14" fill="none" />
  <rect x="230" y="180" width="340" height="26" fill="#192A4D" stroke="#E3642B" stroke-width="3" rx="4" />
  <text x="400" y="200" fill="#FFFFFF" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="14" letter-spacing="2">ROYAL SERENE CITY</text>
  <!-- Main Entrance Road -->
  <polygon points="360,360 440,360 620,500 180,500" fill="#1E293B" />
  <!-- Landscaped Gardens -->
  <circle cx="160" cy="380" r="40" fill="#5B9E4B" />
  <circle cx="640" cy="380" r="40" fill="#5B9E4B" />
  <!-- DTCP Badge Overlay -->
  <rect x="40" y="40" width="350" height="90" rx="8" fill="#0F1A30" opacity="0.94" stroke="#5B9E4B" stroke-width="2" />
  <text x="60" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="20">ROYAL SERENE CITY - PH 1</text>
  <text x="60" y="102" fill="#5B9E4B" font-family="'Inter', sans-serif" font-weight="bold" font-size="14">DTCP-APPROVED • 6 ACRES • WANGAPALLY</text>
</svg>
